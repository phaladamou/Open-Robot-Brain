[project]
name = "open-robot-brain"
version = "0.1.0.dev0"
description = "An open cognitive architecture that separates intelligence from embodiment."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Phal Adamou", email = "phal@example.com" }]
keywords = ["robotics", "embodied-ai", "world-models", "planning", "simulation", "mujoco"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ─── Workspace (uv) ──────────────────────────────────────
[tool.uv.workspace]
members = [
    "packages/types",
    "packages/interfaces",
    "packages/sdk",
    "packages/runtime",
]

[tool.uv.sources]
orb-types = { workspace = true }
orb-interfaces = { workspace = true }
orb-sdk = { workspace = true }
orb-runtime = { workspace = true }

# ─── Dev dependencies (root) ─────────────────────────────
[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "import-linter>=2.0",
    "structlog>=24.4",
]

# ─── Ruff ────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages", "brain", "runtime", "protocols", "simulation", "embodiment"]

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "UP",           # pyupgrade
    "B",            # bugbear
    "A",            # builtins shadowing
    "C4",           # comprehensions
    "DTZ",          # datetime
    "T20",          # no print
    "SIM",          # simplify
    "RUF",          # ruff-specific
    "ANN",          # annotations
]
ignore = [
    "ANN401",  # Any type allowed for **kwargs-style APIs
]
# ANN101/ANN102 were removed in ruff 0.9+; harmless to keep them out of selection
# for older ruff versions used by pre-commit.
extend-ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]
"docs/**" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Mypy ────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mujoco.*"]
ignore_missing_imports = true

# ─── Pytest ──────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests", "packages", "brain", "runtime", "protocols"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow",
    "sim: marks tests requiring simulation",
    "gpu: marks tests requiring GPU",
]

# ─── Coverage ────────────────────────────────────────────
[tool.coverage.run]
source = ["packages", "brain", "runtime", "protocols"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
