[project]
name = "orb-brain"
version = "0.1.0.dev0"
description = "Cognitive core for Open Robot Brain — world model, reasoning, planning, skills."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Phal Adamou" }]
dependencies = [
    "orb-types",
    "orb-interfaces",
    "structlog>=24.4",
]

[tool.uv.sources]
orb-types = { workspace = true }
orb-interfaces = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orb_brain"]

[tool.hatch.build.targets.wheel.force-include]
"src/orb_brain/py.typed" = "orb_brain/py.typed"
