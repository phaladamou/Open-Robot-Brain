[project]
name = "orb-embodiment"
version = "0.1.0.dev0"
description = "Embodiment layer for Open Robot Brain — robot abstraction, capabilities, adapters."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Phal Adamou" }]
dependencies = [
    "orb-types",
    "orb-interfaces",
]

[tool.uv.sources]
orb-types = { workspace = true }
orb-interfaces = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orb_embodiment"]

[tool.hatch.build.targets.wheel.force-include]
"src/orb_embodiment/py.typed" = "orb_embodiment/py.typed"
