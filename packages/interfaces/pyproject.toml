[project]
name = "orb-interfaces"
version = "0.1.0.dev0"
description = "Abstract interfaces for Open Robot Brain (Brain, Embodiment, Planner, Skill, Runtime, Perception)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Phal Adamou" }]
dependencies = [
    "orb-types",
]

[tool.uv.sources]
orb-types = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orb_interfaces"]
