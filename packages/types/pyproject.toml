[project]
name = "orb-types"
version = "0.1.0.dev0"
description = "Shared types for Open Robot Brain (Observation, Action, Goal, Skill, Capability, WorldState, Event)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Phal Adamou" }]
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orb_types"]

[tool.hatch.build.targets.wheel.force-include]
"src/orb_types/py.typed" = "orb_types/py.typed"
